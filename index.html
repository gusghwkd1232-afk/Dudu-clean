<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f9f7">
<title>두두 클린 | 청소용품 카탈로그</title>
<style>
:root{--ink:#19251f;--muted:#68756f;--line:#e3e9e4;--green:#246b50;--pale:#eaf3ed;--bg:#f7f9f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:0 18px}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;padding:16px 0}.logo{font-size:21px;font-weight:850;letter-spacing:-.7px}.logo span{color:var(--green)}.tag{font-size:12px;color:var(--muted);margin-top:3px}
.hero{padding:34px 0 20px}.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:1.3px}h1{font-size:clamp(28px,5vw,44px);line-height:1.2;letter-spacing:-1.4px;margin:10px 0}.intro{color:var(--muted);line-height:1.7;margin:0}
.controls{display:grid;grid-template-columns:minmax(0,1fr) 185px;gap:10px;margin:22px 0 13px}input,select{width:100%;min-height:48px;padding:12px 14px;border:1px solid #dce4de;border-radius:12px;background:#fff;color:var(--ink);font:inherit}
.categories{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#44534b;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}.cat.active{background:var(--green);border-color:var(--green);color:white}
.status{font-size:13px;color:var(--muted);margin:5px 0 15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:42px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.photo{aspect-ratio:4/3;background:#edf2ee;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;background:#fff}.placeholder{font-size:12px;color:#7b8b81;text-align:center;padding:12px}
.cardbody{padding:14px}.pill{display:inline-block;background:var(--pale);color:var(--green);border-radius:6px;padding:4px 7px;font-size:11px;font-weight:750}.card h2{font-size:16px;line-height:1.4;margin:9px 0 5px;letter-spacing:-.3px}.meta{font-size:12px;color:var(--muted);line-height:1.55}.desc{font-size:13px;line-height:1.6;color:#4d5b54;margin:10px 0 0}.more{width:100%;border:1px solid #dce5de;background:#fff;color:var(--green);border-radius:9px;padding:10px;margin-top:13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.more:hover{background:var(--pale)}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd8ce;border-radius:14px;padding:32px;text-align:center;color:var(--muted);line-height:1.7}footer{background:#fff;border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px;line-height:1.7}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 28px));max-height:88vh;overflow:auto;box-shadow:0 24px 80px #0003}dialog::backdrop{background:#14221bb3}.modalphoto{background:#f0f4f0;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}.modalphoto img{width:100%;height:100%;object-fit:contain;background:#fff}.modalbody{padding:20px}.modalbody h2{margin:10px 0}.modalbody p{line-height:1.7;color:#4d5b54;font-size:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#f0f3f0;border-radius:50%;width:38px;height:38px;font-size:21px;cursor:pointer}.detailrow{margin:10px 0;font-size:14px;line-height:1.6}.detailrow b{display:block;color:#65736a;font-size:12px;margin-bottom:2px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.wrap{padding:0 14px}.top{padding:14px 0}.logo{font-size:19px}.hero{padding:27px 0 18px}.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cardbody{padding:11px}.card h2{font-size:14px}.desc{font-size:12px}.photo{aspect-ratio:1/1}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.photo{aspect-ratio:4/3}}
</style>
</head>
<body>
<header><div class="wrap top"><div><div class="logo">두두 <span>클린</span></div><div class="tag">청소용품 제품 카탈로그</div></div></div></header>
<main class="wrap">
<section class="hero">
<div class="eyebrow">CLEANING SUPPLIES CATALOG</div>
<h1>필요한 청소용품을<br>쉽고 빠르게 찾아보세요.</h1>
<p class="intro">제품 정보를 확인하고 비교해 보세요. 가격은 표시하지 않습니다.</p>
<div class="controls"><input id="search" type="search" placeholder="제품명, 브랜드, 용도로 검색" aria-label="제품 검색"><select id="sort" aria-label="정렬"><option value="default">기본 정렬</option><option value="name">제품명순</option><option value="category">카테고리순</option></select></div>
<div class="categories" id="categories"></div><div class="status" id="status">제품 목록을 불러오는 중입니다…</div>
</section>
<section class="grid" id="products" aria-live="polite"></section>
</main>
<footer><div class="wrap">두두 클린 · 제품 상세 및 구매 문의는 별도 문의해 주세요.<br>사진이 등록되지 않은 제품은 사진 영역이 비어 있을 수 있습니다.</div></footer>
<dialog id="detail"><div class="modalphoto" id="modalPhoto"></div><div class="modalbody"><div class="modalhead"><span class="pill" id="modalCategory"></span><button class="close" id="closeModal" aria-label="닫기">×</button></div><h2 id="modalName"></h2><div class="detailrow" id="modalBrand"></div><div class="detailrow" id="modalSpec"></div><div class="detailrow" id="modalUse"></div><p id="modalDesc"></p></div></dialog>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = { products: [], category: "전체" };
  const clean = value => String(value ?? "").trim();
  const pick = (obj, names) => {
    for (const name of names) {
      const key = Object.keys(obj).find(k => k.toLowerCase().replace(/[\s_-]/g,"") === name.toLowerCase().replace(/[\s_-]/g,""));
      if (key && clean(obj[key])) return clean(obj[key]);
    }
    return "";
  };
  // Handles quoted CSV values, including commas and line breaks inside quotes.
  function parseCSV(text) {
    const rows=[]; let row=[], cell="", quoted=false;
    text=text.replace(/^\uFEFF/,"");
    for(let i=0;i<text.length;i++){
      const c=text[i], next=text[i+1];
      if(c === '"'){
        if(quoted && next === '"'){cell+='"';i++;}
        else quoted=!quoted;
      } else if(c === ',' && !quoted){row.push(cell.trim());cell="";}
      else if((c === '\n' || c === '\r') && !quoted){
        if(c === '\r' && next === '\n') i++;
        row.push(cell.trim());cell="";
        if(row.some(v=>v!=="")) rows.push(row);
        row=[];
      } else cell+=c;
    }
    if(cell.length || row.length){row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row);}
    if(!rows.length)return [];
    const headers=rows.shift().map(h=>h.trim());
    return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i] ?? ""])));
  }
  function normalize(raw,index){
    return {
      sku:pick(raw,["sku","code","productcode","id"]) || `item-${index+1}`,
      name:pick(raw,["name","product","productname","제품명","상품명","title"]) || "이름 미등록 제품",
      category:pick(raw,["category","카테고리","분류"]) || "기타",
      brand:pick(raw,["brand","브랜드","maker","제조사"]),
      spec:pick(raw,["spec","size","규격","용량","unit"]),
      image:pick(raw,["image","photo","imageurl","사진","이미지"]),
      description:pick(raw,["description","desc","설명","제품설명"]),
      use:pick(raw,["use","usage","용도","사용처"]),
      active:pick(raw,["active","활성","사용여부","enabled"])
    };
  }
  function isActive(p){return !p.active || !["no","false","0","n","비활성","사용안함"].includes(p.active.toLowerCase());}
  function imageMarkup(path,name,large=false){
    if(!path) return '<div class="placeholder">사진 준비 중</div>';
    const safePath=path.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const safeName=name.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return `<img src="${safePath}" alt="${safeName}" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder',textContent:'사진을 불러올 수 없습니다'}))">`;
  }
  function categories(){
    const all=["전체",...new Set(state.products.map(p=>p.category).filter(Boolean))];
    $("categories").innerHTML=all.map(c=>`<button class="cat ${c===state.category?"active":""}" type="button" data-category="${escapeAttr(c)}">${escapeHTML(c)}</button>`).join("");
  }
  function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function escapeAttr(s){return escapeHTML(s);}
  function render(){
    const query=$("search").value.trim().toLocaleLowerCase("ko");
    let list=state.products.filter(p=>isActive(p)&&(state.category==="전체"||p.category===state.category));
    list=list.filter(p=>[p.name,p.category,p.brand,p.sku,p.spec,p.description,p.use].join(" ").toLocaleLowerCase("ko").includes(query));
    if($("sort").value==="name")list.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
    if($("sort").value==="category")list.sort((a,b)=>a.category.localeCompare(b.category,"ko")||a.name.localeCompare(b.name,"ko"));
    $("status").textContent=`제품 ${list.length}개`;
    const root=$("products");
    if(!list.length){root.innerHTML='<div class="empty">조건에 맞는 제품이 없습니다.<br>검색어를 바꾸거나 다른 카테고리를 선택해 주세요.</div>';return;}
    root.innerHTML=list.map(p=>`<article class="card">
      <div class="photo">${imageMarkup(p.image,p.name)}</div>
      <div class="cardbody"><span class="pill">${escapeHTML(p.category)}</span><h2>${escapeHTML(p.name)}</h2>
      <div class="meta">${p.brand?escapeHTML(p.brand):""}${p.spec?(p.brand?" · ":"")+escapeHTML(p.spec):""}</div>
      ${p.description?`<p class="desc">${escapeHTML(p.description)}</p>`:""}
      <button class="more" type="button" data-detail="${escapeAttr(p.sku)}">제품 정보 보기 ↗</button></div></article>`).join("");
  }
  function showDetail(sku){
    const p=state.products.find(x=>x.sku===sku);if(!p)return;
    $("modalPhoto").innerHTML=imageMarkup(p.image,p.name,true);
    $("modalCategory").textContent=p.category;
    $("modalName").textContent=p.name;
    $("modalBrand").innerHTML=p.brand?`<b>브랜드 / 제조사</b>${escapeHTML(p.brand)}`:"";
    $("modalSpec").innerHTML=p.spec?`<b>규격</b>${escapeHTML(p.spec)}`:"";
    $("modalUse").innerHTML=p.use?`<b>용도</b>${escapeHTML(p.use)}`:"";
    $("modalDesc").textContent=p.description;
    $("detail").showModal();
  }
  $("categories").addEventListener("click",e=>{const b=e.target.closest("[data-category]");if(!b)return;state.category=b.dataset.category;categories();render();});
  $("products").addEventListener("click",e=>{const b=e.target.closest("[data-detail]");if(b)showDetail(b.dataset.detail);});
  $("search").addEventListener("input",render);$("sort").addEventListener("change",render);
  $("closeModal").addEventListener("click",()=>$("detail").close());
  $("detail").addEventListener("click",e=>{if(e.target===$("detail"))$("detail").close();});
  async function load(){
    try{
      const response=await fetch("./products.csv",{cache:"no-store"});
      if(!response.ok)throw new Error(`CSV 불러오기 실패 (${response.status})`);
      const text=await response.text();
      state.products=parseCSV(text).map(normalize).filter(p=>p.name && p.name!=="이름 미등록 제품");
      categories();render();
      if(!state.products.length)$("status").textContent="CSV에 표시할 제품이 없습니다. products.csv의 첫 줄에 열 이름이 있는지 확인해 주세요.";
    }catch(err){
      $("status").textContent="상품 목록을 불러오지 못했습니다.";
      $("products").innerHTML=`<div class="empty"><strong>products.csv를 불러올 수 없습니다.</strong><br>index.html과 products.csv가 같은 폴더에 있는지 확인해 주세요.<br><small>${escapeHTML(err.message||"")}</small></div>`;
    }
  }
  load();
})();
</script>
</body>
</html>
